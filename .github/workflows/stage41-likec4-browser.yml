name: Stage41 official LikeC4 site Chrome smoke
on:
  push:
    branches:
      - docs/stage41-architecture-eval-20261123
    paths:
      - .github/workflows/stage41-likec4-browser.yml
permissions:
  contents: read
jobs:
  likec4-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage41 diagram sources and browser test
        uses: actions/checkout@v4
        with:
          ref: docs/archify-stage39-architecture-20261123
          path: architecture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build official LikeC4 Stage41 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage41-likec4-site"
          cp architecture/docs/diagrams/likec4-stage41/*.c4 "$RUNNER_TEMP/stage41-likec4-site/"
          cd "$RUNNER_TEMP/stage41-likec4-site"
          npx --yes likec4@1.61.0 build -o dist
          test -s dist/index.html
          python3 -m http.server 18767 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/likec4-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/likec4-http.pid"
          python3 - <<'PY'
          import time,urllib.request
          for i in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18767/',timeout=2) as r:
                      assert r.status==200
                      print('LIKEC4_SERVER_READY')
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise RuntimeError('LikeC4 HTTP server unavailable')
          PY
      - name: Inspect official site with installed Chrome
        shell: bash
        env:
          LIKEC4_SITE_URL: http://127.0.0.1:18767/
          LIKEC4_SHOTS: ${{ runner.temp }}/stage41-likec4-chrome
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python architecture/docs/diagrams/qa/stage41-likec4-browser.py
      - name: Preserve actual browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage41-official-likec4-chrome
          path: |
            ${{ runner.temp }}/stage41-likec4-chrome/
            ${{ runner.temp }}/likec4-http.log
          retention-days: 7
          if-no-files-found: warn
