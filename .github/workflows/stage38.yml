name: Stage38 corporate SOP/TWI reasons and XLSX print integrity
on:
  push:
    branches: [feature/stage38-numbered-reasons-corporate-xlsx-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage38-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux corporate XLSX template diff and old Chrome regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage37 release exists and construct Stage38
        run: |
          test -s releases/stage37-desktop-audit-browser-candidate.html
          python tools/build_stage38.py --verify-static
          python tools/build_stage38.py
          python tools/build_stage38.py --verify-release --verify-static
      - name: New and historical unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Chrome workbook test dependencies
        run: python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
      - name: Real Stage37/Stage38 corporate SOP XLSX diff and TWI print
        run: python qa/stage38_numbered_reasons_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage38-reasons-linux
          path: |
            releases/stage38-numbered-reasons-corporate-xlsx-browser-candidate.html
            artifacts/stage38-corporate-numbered.xlsx
            artifacts/stage38-accepted37-corporate.xlsx
            artifacts/stage38-twi-numbered.xlsx
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows offline Chrome corporate XLSX and ISO photo regression
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Stage38
        run: python tools/build_stage38.py
      - name: Install Chrome workbook QA
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Stage38 and entire accepted Stage37 browser regression
        run: python qa/stage38_numbered_reasons_browser.py
      - name: Historical Windows ExcelJS ISO and original SOP photo test
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage38-numbered-reasons-corporate-xlsx-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage38-reasons-windows
          path: |
            releases/stage38-numbered-reasons-corporate-xlsx-browser-candidate.html
            artifacts/stage38-corporate-numbered.xlsx
            artifacts/stage38-twi-numbered.xlsx
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish Stage38 candidate only after BOTH platforms pass
    needs: [linux,windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage38-numbered-reasons-corporate-xlsx-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage38-reasons-linux
          path: .
      - name: Commit verified Stage38 standalone HTML only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage38-numbered-reasons-corporate-xlsx-20261123
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch advanced; skip stale publish"
            exit 0
          fi
          git add releases/stage38-numbered-reasons-corporate-xlsx-browser-candidate.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: Stage38 corporate numbered reasons XLSX verified on Linux Windows"
            git push origin HEAD:feature/stage38-numbered-reasons-corporate-xlsx-20261123
          fi
