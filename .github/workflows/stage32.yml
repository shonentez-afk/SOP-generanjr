name: Stage32 Excel photos fill merged cells
on:
  push:
    branches: [feature/stage32-excel-photo-cell-fit-20261119]
    paths:
      - 'src/modules/excel/stage32-export.js'
      - 'src/app/stage32-parts.json'
      - 'tools/build_stage32.py'
      - 'tests/test_stage32.py'
      - 'qa/stage32_excel_photo_cell_fit.py'
      - 'docs/STAGE32_XLSX_PHOTO_CELL_FIT_RU.md'
      - 'docs/START_NEW_CHAT_RU.md'
      - '.github/workflows/stage32.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/modules/excel/stage32-export.js'
      - 'src/app/stage32-parts.json'
      - 'tools/build_stage32.py'
      - 'tests/test_stage32.py'
      - 'qa/stage32_excel_photo_cell_fit.py'
      - 'docs/STAGE32_XLSX_PHOTO_CELL_FIT_RU.md'
      - 'docs/START_NEW_CHAT_RU.md'
      - '.github/workflows/stage32.yml'
permissions:
  contents: write
concurrency:
  group: stage32-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Stage32 full Chrome and actual OOXML photo anchors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage31 and build Stage32
        run: |
          python tools/build_stage31.py --verify-release --verify-static
          python tools/build_stage32.py
          python tools/build_stage32.py --verify-release --verify-static
      - name: All existing and Stage32 unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline Chrome and real XLSX photo anchor regression
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage32_excel_photo_cell_fit.py
      - name: Upload tested HTML and generated workbook
        uses: actions/upload-artifact@v4
        with:
          name: stage32-full-cell-photos-html-and-example-xlsx
          path: |
            releases/stage32-excel-photo-fill-browser-candidate.html
            artifacts/stage32-full-cell-photo-example.xlsx
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified HTML to feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage32-excel-photo-cell-fit-20261119'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage32-excel-photo-cell-fit-20261119
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch advanced; never publish stale HTML."
            exit 0
          fi
          git add releases/stage32-excel-photo-fill-browser-candidate.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: verified Stage32 full-cell photo HTML"
            git push origin HEAD:feature/stage32-excel-photo-cell-fit-20261119
          fi
  windows:
    name: Stage32 native Windows Chrome and XLSX photo layout
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build offline candidate
        run: python tools/build_stage32.py
      - name: Install browser and XLSX tools
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Existing Windows Chrome ExcelJS ISO regression
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage32-excel-photo-fill-browser-candidate.html'; m.main()"
      - name: Real Windows XLSX photo geometry and import roundtrip
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('photo','qa/stage32_excel_photo_cell_fit.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.photo_cell_acceptance()"
