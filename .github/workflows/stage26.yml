name: Stage 26 final browser acceptance
on:
  push:
    branches: [main, feature/stage26-final-hardening-browser-acceptance-20261119]
    paths:
      - 'src/modules/ai/stage26-*.js'
      - 'src/modules/review/stage26-*.js'
      - 'src/modules/frv/stage26-*.js'
      - 'src/app/stage26-parts.json'
      - 'tools/build_stage26.py'
      - 'tests/test_stage26.py'
      - 'qa/stage26_*.py'
      - 'releases/stage26-final-browser-candidate.html'
      - '.github/workflows/stage26.yml'
  pull_request:

jobs:
  full-linux-regression:
    name: Full regression and real Chrome file protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all deterministic builds and offline shell
        run: |
          python tools/build_stage19.py --verify-baseline
          python tools/build_stage20.py --verify-release
          python tools/build_stage21.py --verify-release
          python tools/build_stage22.py --verify-release
          python tools/build_stage23.py --verify-release
          python tools/build_stage24.py --verify-release
          python tools/build_stage25.py --verify-release
          python tools/build_stage26.py --verify-release
          python tools/build_stage26.py --verify-static
      - name: All current source and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Verify one syntax-correct offline JavaScript bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('releases/stage26-final-browser-candidate.html').read_text(encoding='utf-8')
          marker="<script>\n'use strict';"
          assert s.count(marker)==1
          Path('/tmp/stage26.js').write_text("'use strict';\n"+
              s.split(marker,1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/stage26.js
      - name: Chrome file:// old Excel/photo/ISO/TWI/SOP/FRV and new AI acceptance
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage26_browser_smoke.py

  native-windows-file:
    name: Native Windows file protocol and offline assets
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify standalone Stage26 source build
        run: python tools/build_stage26.py --verify-release
      - name: Install browser test dependency
        run: python -m pip install "playwright>=1.50,<2"
      - name: Test Chrome Windows file:// without internet
        run: python qa/stage26_windows_smoke.py
