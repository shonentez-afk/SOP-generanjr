name: Stage40 inline AI corrections in existing SOP review
on:
  push:
    branches: [feature/stage40-inline-ai-review-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Stage40 inline diff and historical regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage39.1 and reproducible Stage40
        run: |
          python tools/build_stage39_1.py --verify-static --verify-release
          python tools/build_stage40.py --verify-static
          python tools/build_stage40.py
          python tools/build_stage40.py --verify-static --verify-release
      - name: All inherited tests and new Stage40 contracts
        run: python -m unittest discover -s tests -v
      - name: Install standalone Chrome regression dependencies
        run: python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
      - name: Real Chrome Stage40 inline diff and stale proposal guard
        run: python qa/stage40_inline_review_browser.py
      - name: Inherited real Chrome Stage39.1 Reason and WHY on Stage40
        run: python qa/stage40_compat_browser.py
      - name: Full Stage39.1 corporate SOP/TWI XLSX and FRV baseline
        run: python qa/stage39_1_ai_reasons_frv_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage40-linux
          path: releases/stage40-inline-review-browser-candidate.html
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows Stage40 inline diff, Chrome and ExcelJS
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Stage39.1 baseline and build Stage40
        run: |
          python tools/build_stage39_1.py --verify-static --verify-release
          python tools/build_stage40.py --verify-static
          python tools/build_stage40.py
          python tools/build_stage40.py --verify-static --verify-release
      - name: Windows Stage40 static and Node syntax contracts
        run: python -m unittest discover -s tests -p test_stage40.py -v
      - name: Install Chrome dependencies
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Real Chrome Stage40 inline diff and stale proposal guard
        run: python qa/stage40_inline_review_browser.py
      - name: Inherited Chrome Stage39.1 Reason and WHY on Stage40
        run: python qa/stage40_compat_browser.py
      - name: Windows offline photo, ISO and ExcelJS smoke on Stage40
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage40-inline-review-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage40-windows
          path: releases/stage40-inline-review-browser-candidate.html
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Stage40 only after Linux and Windows PASS
    needs: [linux,windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage40-inline-ai-review-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage40-linux
          path: artifacts-from-linux
      - name: Publish byte-identical verified Stage40 standalone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage40-inline-ai-review-20261123
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch advanced; skip stale publish"
            exit 0
          fi
          if [ -s artifacts-from-linux/releases/stage40-inline-review-browser-candidate.html ]; then
            source_file=artifacts-from-linux/releases/stage40-inline-review-browser-candidate.html
          else
            source_file=artifacts-from-linux/stage40-inline-review-browser-candidate.html
          fi
          test -s "$source_file"
          mkdir -p releases
          cp "$source_file" releases/stage40-inline-review-browser-candidate.html
          cp "$source_file" releases/stage40-inline-review-20261123.html
          cmp releases/stage40-inline-review-browser-candidate.html releases/stage40-inline-review-20261123.html
          git add releases/stage40-inline-review-browser-candidate.html releases/stage40-inline-review-20261123.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: Stage40 verified Chrome Linux Windows"
            git push origin HEAD:feature/stage40-inline-ai-review-20261123
          fi
