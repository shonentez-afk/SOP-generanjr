name: Stage 27 intelligent SOP assistant
on:
  push:
    branches: [feature/stage27-intelligent-assistant-20261119]
    paths:
      - 'src/modules/ai/stage27-*.js'
      - 'src/modules/app/stage27-ui.js'
      - 'src/modules/documents/stage27-*.js'
      - 'src/app/stage27-parts.json'
      - 'tools/build_stage27.py'
      - 'tests/test_stage27.py'
      - 'qa/stage27_*.py'
      - '.github/workflows/stage27.yml'
  pull_request:
    paths:
      - 'src/modules/ai/stage27-*.js'
      - 'src/modules/app/stage27-ui.js'
      - 'src/modules/documents/stage27-*.js'
      - 'src/app/stage27-parts.json'
      - 'tools/build_stage27.py'
      - 'tests/test_stage27.py'
      - 'qa/stage27_*.py'
      - '.github/workflows/stage27.yml'
permissions:
  contents: write
jobs:
  linux:
    name: Build full regression + Chrome offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Stage27 and verify frozen Stage26
        run: |
          python tools/build_stage26.py --verify-release --verify-static
          python tools/build_stage27.py
          python tools/build_stage27.py --verify-release --verify-static
      - name: Run all existing and Stage27 Python/Node unit tests
        run: python -m unittest discover -s tests -v
      - name: Check standalone JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("releases/stage27-intelligent-assistant-browser-candidate.html").read_text(encoding="utf-8")
          marker="<script>\n'use strict';"
          assert html.count(marker)==1
          Path("/tmp/stage27.js").write_text("'use strict';\n"+
              html.split(marker,1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/stage27.js
      - name: Chrome file:// full Stage26 and Stage27 regression
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage27_browser_smoke.py
      - name: Upload verified standalone candidate
        uses: actions/upload-artifact@v4
        with:
          name: stage27-intelligent-assistant-html
          path: releases/stage27-intelligent-assistant-browser-candidate.html
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated HTML to feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage27-intelligent-assistant-20261119'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/stage27-intelligent-assistant-browser-candidate.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: checked Stage27 offline HTML release"
            git push origin HEAD:feature/stage27-intelligent-assistant-20261119
          fi
  windows:
    name: Native Windows file:// and offline library
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build offline Stage27
        run: python tools/build_stage27.py
      - name: Install Playwright
        run: python -m pip install "playwright>=1.50,<2"
      - name: Reuse Stage26 native Windows acceptance against Stage27
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage27-intelligent-assistant-browser-candidate.html'; m.main()"
