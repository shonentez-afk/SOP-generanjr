name: Architecture tools Stage39 evaluation (CodeFlow and LikeC4)
on:
  push:
    branches:
      - docs/architecture-tool-eval-20261123
    paths:
      - .github/workflows/architecture-stage39-tools.yml
permissions:
  contents: read
jobs:
  codeflow-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned Stage39
        uses: actions/checkout@v4
        with:
          path: sop
          ref: 4cf1a467e912984cb98d6dc969ab10eb685f458b
          persist-credentials: false
      - name: Checkout CodeFlow at reviewed commit
        uses: actions/checkout@v4
        with:
          repository: braedonsaunders/codeflow
          ref: b70af01cfd1a1cec4b02075b124fdd1ec8cc33be
          path: codeflow
          persist-credentials: false
      - name: Checkout architecture docs to compare with prior graph
        uses: actions/checkout@v4
        with:
          ref: docs/archify-stage39-architecture-20261123
          path: architecture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make isolated directory of 67 active JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE="$GITHUB_WORKSPACE/sop"
          export DEST="$RUNNER_TEMP/stage39-codeflow"
          echo "TRIAL_SOURCE=$DEST" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path(os.environ['SOURCE'])
          manifest=json.loads((root/'src/app/stage39-parts.json').read_text())
          paths=manifest['modules']
          assert len(paths)==67 and len(set(paths))==67
          dest=pathlib.Path(os.environ['DEST'])
          for name in paths:
              p=root/name
              assert p.is_file(), name
              t=dest/name
              t.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,t)
          print('STAGE39_ACTIVE_JS',len(paths))
          PY
      - name: Run actual CodeFlow headless analysis (shared browser analyzer)
        shell: bash
        run: |
          set -euo pipefail
          node codeflow/card/analyze.js --path "$TRIAL_SOURCE" > "$RUNNER_TEMP/codeflow-full.json"
          export CODEFLOW_JSON="$RUNNER_TEMP/codeflow-full.json"
          export PRIOR_GRAPH="$GITHUB_WORKSPACE/architecture/docs/diagrams/stage39-verified-callgraph.json"
          python3 - <<'PY'
          import collections, json, os, pathlib
          raw=json.loads(pathlib.Path(os.environ['CODEFLOW_JSON']).read_text())
          data=raw['data']
          stats=data['stats']
          assert stats['files']==67, f"Expected 67 JavaScript files, got {stats['files']}"
          original=json.loads(pathlib.Path(os.environ['PRIOR_GRAPH']).read_text())
          old={(e['from'],e['to']) for e in original['edges']}
          connections=data.get('connections',[])
          scoped=set(n['path'] for n in original['nodes'])
          cf={(e['target'],e['source']) for e in connections if e.get('source') in scoped and e.get('target') in scoped and e['source'] != e['target']}
          matches=cf&old
          extra=cf-old
          missing=old-cf
          fns=data.get('functions',[])
          result={
              'provenance': 'CodeFlow HEADLESS analyzer from pinned b70af01; JS extraction uses its fallback parser, NOT browser TreeSitter WASM',
              'snapshot': 'Stage39 4cf1a467',
              'stats':stats,
              'codeflow_total_connections':len(connections),
              'codeflow_unique_file_edges':len(cf),
              'prior_heuristic_file_edges':len(old),
              'overlap_count':len(matches),
              'codeflow_only_count':len(extra),
              'prior_only_count':len(missing),
              'codeflow_edges':sorted([{'caller':a,'definition':b} for a,b in cf],key=lambda e:(e['caller'],e['definition'])),
              'overlap_samples':sorted([{'caller':a,'definition':b} for a,b in matches],key=lambda e:(e['caller'],e['definition']))[:40],
              'codeflow_only_samples':sorted([{'caller':a,'definition':b} for a,b in extra],key=lambda e:(e['caller'],e['definition']))[:40],
              'aiAsk_call_edges':[{k:v for k,v in c.items() if k in ('source','target','fn','type')} for c in connections if c.get('fn')=='aiAsk'][:30],
              'functions_sample':[{'name':x.get('name'),'file':x.get('file'),'path':x.get('path')} for x in fns if x.get('name') in ('aiAsk','generateSOP','reviewEntireSOP','generateTwiPlan')][:30],
          }
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'codeflow-summary.json'
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('CODEFLOW_METRICS',json.dumps({k:v for k,v in result.items() if k in ('codeflow_total_connections','codeflow_unique_file_edges','prior_heuristic_file_edges','overlap_count','codeflow_only_count','prior_only_count')},ensure_ascii=False))
          print('CODEFLOW_SUMMARY_STATS',json.dumps({k:stats.get(k) for k in ('files','functions','connections','dead','loc')},ensure_ascii=False))
          print('CODEFLOW_AIASK_EDGES',json.dumps(result['aiAsk_call_edges'][:8],ensure_ascii=False))
          print('CODEFLOW_ONLY',json.dumps(result['codeflow_only_samples'][:6],ensure_ascii=False))
          for i in range(0, len(result['codeflow_edges']), 40):
              print('CODEFLOW_EDGE_BLOCK_' + str(i//40) + '=' + json.dumps(result['codeflow_edges'][i:i+40],separators=(',',':'),ensure_ascii=False))
          PY
      - name: Store comparison as separate temporary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-codeflow-summary
          path: ${{ runner.temp }}/codeflow-summary.json
          if-no-files-found: warn
          retention-days: 7
  likec4-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagrams from architecture branch
        uses: actions/checkout@v4
        with:
          ref: docs/archify-stage39-architecture-20261123
          path: architecture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated official LikeC4 model input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/likec4-src"
          cp architecture/docs/diagrams/likec4/*.c4 "$RUNNER_TEMP/likec4-src/"
          ls -la "$RUNNER_TEMP/likec4-src"
          echo "LIKEC4_DIR=$RUNNER_TEMP/likec4-src" >> "$GITHUB_ENV"
      - name: Render with official LikeC4 1.61.0 CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$LIKEC4_DIR"
          node --version
          npx --yes likec4@1.61.0 build -o dist 2>&1 | tee "$RUNNER_TEMP/likec4-build.log"
          test -f dist/index.html
          echo "LIKEC4_BUILD_PASS"
          find dist -type f | head -n 25
      - name: Save official site build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-likec4-official-site
          path: |
            ${{ runner.temp }}/likec4-src/dist/
            ${{ runner.temp }}/likec4-build.log
          if-no-files-found: warn
          retention-days: 7
