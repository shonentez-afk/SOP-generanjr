name: Build standalone SOP
on:
  push:
  pull_request:
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standalone HTML matches Stage 11
        run: python tools/build.py --verify-baseline
      - name: Run build tests
        run: python -m unittest discover -s tests -v
