name: Stage41 AST evidence for CodeFlow links
on:
  push:
    branches:
      - docs/stage41-architecture-eval-20261123
    paths:
      - .github/workflows/stage41-ast-evidence.yml
permissions:
  contents: read
jobs:
  ast-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout accepted Stage41 at pinned commit
        uses: actions/checkout@v4
        with:
          path: sop
          ref: fc1c06a034a52e8218b49bd87483adbd900c3ae4
          persist-credentials: false
      - name: Checkout architecture source files
        uses: actions/checkout@v4
        with:
          path: architecture
          ref: docs/archify-stage39-architecture-20261123
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned syntax parsers into temporary evaluation directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ast-eval"
          cp architecture/docs/diagrams/qa/stage41-ast-evidence.mjs "$RUNNER_TEMP/ast-eval/"
          npm install --prefix "$RUNNER_TEMP/ast-eval" --no-save --ignore-scripts --no-audit --no-fund acorn@8.15.0 acorn-walk@8.3.4 acorn-loose@8.5.2
      - name: Check all 367 Stage41 file links against JavaScript AST
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/ast-eval/stage41-ast-evidence.mjs"             "$GITHUB_WORKSPACE/sop"             "$GITHUB_WORKSPACE/architecture/docs/diagrams/stage41-codeflow-graph.json"             "$RUNNER_TEMP/stage41-ast-evidence.json"             | tee "$RUNNER_TEMP/stage41-ast-summary.log"
      - name: Upload AST evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage41-ast-evidence-report
          path: |
            ${{ runner.temp }}/stage41-ast-evidence.json
            ${{ runner.temp }}/stage41-ast-summary.log
          retention-days: 7
          if-no-files-found: warn
