name: Stage41 conservative AI quality and Stage40 integrity
on:
  push:
    branches: [feature/stage41-ai-quality-conservative-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage41-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Stage41 prompt QA and full historical regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage40 byte-exact and build Stage41
        run: |
          python tools/build_stage40.py --verify-static --verify-release
          python tools/build_stage41.py --verify-static
          python tools/build_stage41.py
          python tools/build_stage41.py --verify-static --verify-release
      - name: Full inherited unit tests and new Stage41 contracts
        run: python -m unittest discover -s tests -v
      - name: Install Chrome, XLSX and photo acceptance dependencies
        run: python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
      - name: Chrome Stage41 model prompt routing, review quality and unchanged Stage40 UI
        run: python qa/stage41_ai_quality_browser.py
      - name: Inherited Chrome Stage39.1 Reason and TWI semantics on Stage41
        run: python qa/stage41_compat_browser.py
      - name: Accepted Stage40 inline-review full Chrome regression
        run: python qa/stage40_inline_review_browser.py
      - name: Corporate SOP/TWI XLSX and FRV baseline regression
        run: python qa/stage39_1_ai_reasons_frv_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage41-linux
          path: releases/stage41-ai-quality-browser-candidate.html
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows Stage41 Chrome quality, ExcelJS and photos
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage40 and build Stage41
        run: |
          python tools/build_stage40.py --verify-static --verify-release
          python tools/build_stage41.py --verify-static
          python tools/build_stage41.py
          python tools/build_stage41.py --verify-static --verify-release
      - name: Stage41 contracts and Node syntax on Windows
        run: python -m unittest discover -s tests -p test_stage41.py -v
      - name: Install Chrome, XLSX and photo acceptance dependencies
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Chrome Stage41 prompt routing and guarded review
        run: python qa/stage41_ai_quality_browser.py
      - name: Inherited Chrome Stage39.1 Reason and TWI semantics on Stage41
        run: python qa/stage41_compat_browser.py
      - name: Offline Chrome ExcelJS, ISO photos and TWI XLSX on Stage41
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage41-ai-quality-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage41-windows
          path: releases/stage41-ai-quality-browser-candidate.html
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Stage41 standalone after Linux and Windows PASS
    needs: [linux,windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage41-ai-quality-conservative-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage41-linux
          path: artifacts-from-linux
      - name: Publish byte-identical Stage41 HTML to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage41-ai-quality-conservative-20261123
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch advanced; skip stale publish"
            exit 0
          fi
          if [ -s artifacts-from-linux/releases/stage41-ai-quality-browser-candidate.html ]; then
            source_file=artifacts-from-linux/releases/stage41-ai-quality-browser-candidate.html
          else
            source_file=artifacts-from-linux/stage41-ai-quality-browser-candidate.html
          fi
          test -s "$source_file"
          mkdir -p releases
          cp "$source_file" releases/stage41-ai-quality-browser-candidate.html
          cp "$source_file" releases/stage41-ai-quality-20261123.html
          cmp releases/stage41-ai-quality-browser-candidate.html releases/stage41-ai-quality-20261123.html
          git add releases/stage41-ai-quality-browser-candidate.html releases/stage41-ai-quality-20261123.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: Stage41 verified Chrome Linux Windows quality and Stage40 integrity"
            git push origin HEAD:feature/stage41-ai-quality-conservative-20261123
          fi
