name: Stage 25 A3-A4 safe SOP and FRV proposals
on:
  push:
    branches: [main, feature/stage25-ai-safe-previews-errors-20261119]
    paths:
      - 'src/modules/ai/stage25-*.js'
      - 'src/modules/frv/stage25-*.js'
      - 'src/app/stage25-parts.json'
      - 'tools/build_stage25.py'
      - 'tests/test_stage25.py'
      - 'qa/stage25_browser_smoke.py'
      - 'releases/stage25-ai-safe-replacement.html'
      - '.github/workflows/stage25.yml'
  pull_request:
jobs:
  safe-proposals:
    name: Old releases, current tests and Chrome file protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify every source build and unchanged HTML assets
        run: |
          python tools/build_stage19.py --verify-baseline
          python tools/build_stage20.py --verify-release
          python tools/build_stage21.py --verify-release
          python tools/build_stage22.py --verify-release
          python tools/build_stage23.py --verify-release
          python tools/build_stage24.py --verify-release
          python tools/build_stage25.py --verify-release
          python tools/build_stage25.py --verify-static
      - name: Full unit regression and new error/preview contracts
        run: python -m unittest discover -s tests -v
      - name: Validate standalone runtime JS
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('releases/stage25-ai-safe-replacement.html').read_text(encoding='utf-8')
          marker="<script>\n'use strict';"
          assert html.count(marker)==1
          Path('/tmp/stage25.js').write_text("'use strict';\n"+html.split(marker,1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/stage25.js
      - name: Chrome file:// SOP and FRV non-destructive AI + all old features
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage25_browser_smoke.py
