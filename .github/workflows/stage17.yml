name: Stage 17 AI mentor JSON recovery
on:
  push:
    branches: [main, fix/stage17-ai-mentor-json-recovery-20261118]
  pull_request:
jobs:
  stage17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release reproduction
        run: python tools/build_stage17.py --verify-release
      - name: All regressions
        run: python -m unittest discover -s tests -v
      - name: JS syntax of full standalone release
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('releases/stage17-mentor-json-recovery.html').read_text(encoding='utf-8')
          js=[x for x in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s) if "'use strict';" in x]
          assert len(js)==1
          Path('/tmp/sop-stage17.js').write_text(js[0],encoding='utf-8')
          PY
          node --check /tmp/sop-stage17.js
      - name: Chrome real file-mode regressions (Stage 16, unchanged)
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage16_real_excel_photos.py
