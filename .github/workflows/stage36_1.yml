name: Stage36.1 TWI JI print-ready XLSX acceptance
on:
  push:
    branches: [feature/stage36-1-twi-print-xlsx-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage36-1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux TWI JI workbook and all SOP regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted Stage36 baseline and build Stage36.1
        run: |
          python tools/build_stage36.py --verify-release --verify-static
          python tools/build_stage36_1.py --verify-static
          python tools/build_stage36_1.py
          python tools/build_stage36_1.py --verify-release --verify-static
      - name: Unit and historical regression
        run: python -m unittest discover -s tests -v
      - name: Install Chrome and XLSX QA dependencies
        run: python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
      - name: Chrome file TWI XLSX and accepted Stage36 regression
        run: python qa/stage36_1_twi_print_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-1-twi-print-linux
          path: |
            releases/stage36-1-twi-print-xlsx-browser-candidate.html
            artifacts/stage36-1-twi-export-ui.png
            artifacts/stage36-1-twi-print.xlsx
            artifacts/stage36-1-twi-review-needed.xlsx
            artifacts/stage36-1-published-twi.xlsx
          if-no-files-found: error
          retention-days: 30
      - name: Publish only after a complete Linux QA
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage36-1-twi-print-xlsx-20261123'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage36-1-twi-print-xlsx-20261123
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch moved; skip stale publish"
            exit 0
          fi
          git add releases/stage36-1-twi-print-xlsx-browser-candidate.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: Stage36.1 TWI JI print XLSX verified standalone"
            git push origin HEAD:feature/stage36-1-twi-print-xlsx-20261123
          fi
  windows:
    name: Windows ExcelJS and existing photo/TWI/SOP QA
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build release
        run: python tools/build_stage36_1.py
      - name: Install Chrome and XLSX QA
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Windows Chrome print TWI and accepted Stage36 regression
        run: python qa/stage36_1_twi_print_browser.py
      - name: Existing Windows photo ExcelJS ISO and TWI QA
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage36-1-twi-print-xlsx-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-1-twi-print-windows
          path: |
            releases/stage36-1-twi-print-xlsx-browser-candidate.html
            artifacts/stage36-1-twi-print.xlsx
          if-no-files-found: error
