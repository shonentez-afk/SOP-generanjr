name: Stage 24 A3-A4 typed AI and safe TWI
on:
  push:
    branches: [main, feature/stage24-a3-a4-twi-safe-regeneration-20261119]
    paths:
      - 'src/modules/twi/stage24-*.js'
      - 'src/modules/ai/stage24-*.js'
      - 'src/app/stage24-parts.json'
      - 'tools/build_stage24.py'
      - 'tests/test_stage24.py'
      - 'qa/stage24_browser_smoke.py'
      - 'releases/stage24-a3-a4-twi-protected.html'
      - '.github/workflows/stage24.yml'
  pull_request:
jobs:
  twi-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify existing and Stage24 standalone source builds
        run: |
          python tools/build_stage19.py --verify-baseline
          python tools/build_stage20.py --verify-release
          python tools/build_stage21.py --verify-release
          python tools/build_stage22.py --verify-release
          python tools/build_stage23.py --verify-release
          python tools/build_stage24.py --verify-release
          python tools/build_stage24.py --verify-static
      - name: Complete Python and Node unit test suite
        run: python -m unittest discover -s tests -v
      - name: Validate built runtime JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("releases/stage24-a3-a4-twi-protected.html").read_text(encoding="utf-8")
          marker="<script>\n'use strict';"
          assert html.count(marker)==1
          Path("/tmp/stage24.js").write_text("'use strict';\n"+html.split(marker,1)[1].split("</script>",1)[0],encoding="utf-8")
          PY
          node --check /tmp/stage24.js
      - name: Real Chrome file:// all features and repeated TWI preview/merge
        run: |
          python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
          python qa/stage24_browser_smoke.py
