name: SharePoint Connector 1
on:
  push:
    branches: ['feature/sharepoint-connector-1-20261124']
    paths: ['connector/**', '.github/workflows/sharepoint-connector-1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fixture tests
        run: dotnet run --project connector/Tests/Sop.SharePoint.Tests.csproj -c Release
      - name: Build candidate
        run: dotnet publish connector/Windows/Sop.SharePoint.Windows.csproj -c Release -r win-x64 --self-contained false -o connector-publish
      - uses: actions/upload-artifact@v4
        with:
          name: SOP-SharePoint-Connector-1-Windows-candidate
          path: connector-publish/
          if-no-files-found: error
