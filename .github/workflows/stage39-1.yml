name: Stage39.1 AI Stage38 Reasons and FRV integrity
on:
  push:
    branches: [feature/stage39-1-ai-reasons-frv-20261123]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage39-1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux Stage39.1 AI FRV corporate XLSX and historical Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Accepted Stage39 byte-exact build and new candidate
        run: |
          test -s releases/stage39-step-management-browser-candidate.html
          python tools/build_stage39.py --verify-static --verify-release
          python tools/build_stage39_1.py --verify-static
          python tools/build_stage39_1.py
          python tools/build_stage39_1.py --verify-static --verify-release
      - name: Unit tests including Stage38/39/39.1 and Node syntax
        run: python -m unittest discover -s tests -v
      - name: Install browser and workbook verification
        run: python -m pip install 'playwright>=1.50,<2' 'openpyxl>=3.1,<4' 'Pillow>=10,<12'
      - name: Stage39.1 Chrome AI, FRV and corporate SOP/TWI XLSX
        run: python qa/stage39_1_ai_reasons_frv_browser.py
      - name: Real Chrome TWI WHY semantic regression from user's screenshot
        run: python qa/stage39_1_twi_why_browser.py
      - name: Stage39 structural actions and complete Stage37 regression on new HTML
        run: |
          python -c "import sys;sys.path.insert(0,'qa');import importlib.util; s=importlib.util.spec_from_file_location('qa39','qa/stage39_step_management_browser.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage39-1-ai-reasons-frv-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage39-1-linux
          path: |
            releases/stage39-1-ai-reasons-frv-browser-candidate.html
            artifacts/stage39-1-sop.xlsx
            artifacts/stage39-1-twi.xlsx
          if-no-files-found: error
          retention-days: 30
  windows:
    name: Windows Stage39.1 AI FRV photo and corporate Excel
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify baseline and build Stage39.1
        run: |
          python tools/build_stage39.py --verify-static --verify-release
          python tools/build_stage39_1.py --verify-static
          python tools/build_stage39_1.py
          python tools/build_stage39_1.py --verify-static --verify-release
      - name: Stage39.1 contract and Node syntax checks on Windows
        run: python -m unittest discover -s tests -p test_stage39_1.py -v
      - name: Install Chrome workbook QA
        run: python -m pip install "playwright>=1.50,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
      - name: Stage39.1 real Chrome AI Reason and FRV verification
        run: python qa/stage39_1_ai_reasons_frv_browser.py
      - name: Windows Chrome TWI WHY reason quality and no data rewrite
        run: python qa/stage39_1_twi_why_browser.py
      - name: Stage39 actions plus old browser regression
        run: |
          python -c "import sys;sys.path.insert(0,'qa');import importlib.util; s=importlib.util.spec_from_file_location('qa39','qa/stage39_step_management_browser.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage39-1-ai-reasons-frv-browser-candidate.html'; m.main()"
      - name: Windows photo/ISO/ExcelJS original export smoke
        run: |
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('win','qa/stage26_windows_smoke.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.RELEASE=m.ROOT/'releases/stage39-1-ai-reasons-frv-browser-candidate.html'; m.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: stage39-1-windows
          path: |
            releases/stage39-1-ai-reasons-frv-browser-candidate.html
            artifacts/stage39-1-sop.xlsx
            artifacts/stage39-1-twi.xlsx
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish Stage39.1 standalone only after BOTH platforms pass
    needs: [linux,windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/stage39-1-ai-reasons-frv-20261123'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage39-1-linux
          path: artifacts-from-linux
      - name: Publish verified Stage39.1 HTML to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/stage39-1-ai-reasons-frv-20261123
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch advanced; skip stale publish"
            exit 0
          fi
          if [ -s artifacts-from-linux/releases/stage39-1-ai-reasons-frv-browser-candidate.html ]; then
            source_file=artifacts-from-linux/releases/stage39-1-ai-reasons-frv-browser-candidate.html
          else
            source_file=artifacts-from-linux/stage39-1-ai-reasons-frv-browser-candidate.html
          fi
          test -s "$source_file"
          mkdir -p releases
          cp "$source_file" releases/stage39-1-ai-reasons-frv-browser-candidate.html
          git add releases/stage39-1-ai-reasons-frv-browser-candidate.html
          if ! git diff --cached --quiet; then
            git commit -m "Build: Stage39.1 verified Chrome Linux Windows AI FRV XLSX"
            git push origin HEAD:feature/stage39-1-ai-reasons-frv-20261123
          fi
